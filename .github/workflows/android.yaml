name: Android

on:
  push:
    branches:
      - main

env:
  GRADLE_OPTS: "-Dorg.gradle.unsafe.configuration-cache=false"

jobs:
  build:
    name: Debug Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: adopt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew loses the executable bit when the repository is edited on Windows
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Pure Kotlin module (no Android SDK needed): the parser of the BARS pages, shared with iOS
      - name: BARS parser tests
        run: ./gradlew :lib_bars_parser:jvmTest :lib_bars_client:jvmTest :feature_bars_shared:jvmTest

      # Multiplatform foundation (M1 of the iOS plan): the same modules are compiled for iOS in the iOS workflow
      - name: KMP foundation tests
        run: ./gradlew :ext_kotlin:jvmTest :ext_koin:jvmTest :lib_coroutines:jvmTest

      - name: Build with Gradle
        run: ./gradlew :app:assembleDebug
        env:
          MAP_KEY: ${{ secrets.MAP_KEY }}
