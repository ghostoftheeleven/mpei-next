// activity-compose 1.12 (it is what navigation3 of the demo needs) brings navigationevent 1.0.2, which Compose UI 1.9 of the
// BOM does not know: the demo crashed on the start. With 1.11 (as in the main app) the plain screens work, MapDemoActivity
// is one of them; the navigation3 screens of MainActivity do not (they need the newer activity). Known, not fixed here.
configurations.configureEach {
    resolutionStrategy.force(
        "androidx.activity:activity:1.11.0",
        "androidx.activity:activity-ktx:1.11.0",
        "androidx.activity:activity-compose:1.11.0",
    )
}
